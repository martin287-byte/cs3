<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Farm</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14121f; color: #eee; font-family: monospace; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; width: min(96vw, 960px); aspect-ratio: 16 / 9; }
    p { opacity: .7; font-size: 13px; text-align: center; margin: 8px; }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="270"></canvas>
  <p>WASD/arrows move · 1-5 pick tool (5 = seeds, Q cycles) · Space use / cast / reel / mine · E interact · I inventory (number = eat) · Esc pause · M music<br>Mine in the Forest · Cook at your farmhouse · Zed visits every 5th day · Festivals on day 8 of each season · Goal: save $3000</p>
  <script type="module" src="main.js"></script>
</body>
</html>
