bolt Farm oldal\xE1n kaphat\xF3).","You fed the {0}. They look happy!":"Megetetted a(z) {0}. El\xE9gedettnek t\u0171nnek!","The {0} enjoys it. (hearts: {1})":"Tetszik neki. ({0}, sz\xEDv: {1})","You pet the {0}. ({1} hearts)":"Megsimogattad: {0}. ({1} sz\xEDv)","Happy {0}: +{1} extra.":"Boldog \xE1llatok: +{1} extra ({0}).","Your {0} were hungry and gave nothing.":"A(z) {0} \xE9hesek voltak, \xE9s nem adtak semmit.","Feed your animals hay every day: fed and happy animals give more eggs and milk.":"Etesd az \xE1llataidat naponta sz\xE9n\xE1val: a j\xF3llakott, boldog \xE1llatok t\xF6bb toj\xE1st \xE9s tejet adnak.","Rosa is staring at a tray of burnt rolls.":"Rosa egy t\xE1lca oda\xE9gett zseml\xE9t b\xE1mul.","Rosa: Oh! I got so busy chatting that I forgot the oven. Don't tell anyone.":"Rosa: Jaj! Annyira belemer\xFCltem a besz\xE9lget\xE9sbe, hogy elfelejtettem a s\xFCt\u0151t. Ne \xE1ruld el senkinek.","Rosa: Here \u2014 take a few of the good ones as a thank-you for keeping my secret.":"Rosa: Tess\xE9k, vigy\xE9l p\xE1r j\xF3t, h\xE1l\xE1b\xF3l, ami\xE9rt megtartod a titkomat.","Rosa has set a small table behind the bakery.":"Rosa kis asztalt ter\xEDtett a p\xE9ks\xE9g m\xF6g\xF6tt.","Rosa: I never share my grandmother's recipe, but I trust you. Sugar first, then patience.":"Rosa: A nagymam\xE1m receptj\xE9t soha nem osztom meg, de neked megb\xEDzom. El\u0151bb a cukor, azt\xE1n a t\xFCrelem.","Rosa: Promise me you'll bake something wonderful with it. Take this, you earned it.":"Rosa: \xCDg\xE9rd meg, hogy valami csod\xE1sat s\xFCtsz bel\u0151le. Fogadd el ezt, meg\xE9rdemelted.","Oliver is rearranging the same shelf for the third time.":"Oliver m\xE1r harmadszor rendezi \xE1t ugyanazt a polcot.","Oliver: Business is slow and I'm talking to jars of seeds. Thanks for stopping by.":"Oliver: Lanyha az \xFCzlet, m\xE1r a magos \xFCvegekkel besz\xE9lgetek. K\xF6sz\xF6n\xF6m, hogy ben\xE9zt\xE9l.","Oliver: A good customer deserves a bonus. Here's a little something on the house.":"Oliver: Egy j\xF3 vev\u0151 jutalmat \xE9rdemel. Itt egy kis aj\xE1nd\xE9k a h\xE1zt\xF3l.","Oliver closes the shop early and hangs a sign on the door.":"Oliver kor\xE1n bez\xE1r, \xE9s t\xE1bl\xE1t tesz az ajt\xF3ra.","Oliver: I used to dream of a farm of my own. Now I sell seeds to people who do the dreaming for me.":"Oliver: R\xE9gen saj\xE1t farmr\xF3l \xE1lmodtam. Most magokat \xE1rulok azoknak, akik helyettem \xE1lmodnak.","Oliver: You're doing it right. Here, a share of my best stock.":"Oliver: J\xF3l csin\xE1lod. Tess\xE9k, egy kis a legjobb k\xE9szletemb\u0151l.","Mina is sitting on the dock with a tangled fishing line.":"Mina a st\xE9gen \xFCl egy \xF6sszegubancol\xF3dott horg\xE1szzsin\xF3rral.","Mina: Three hours, no bites, and now this. The lake is laughing at me.":"Mina: H\xE1rom \xF3ra, egy kap\xE1s sem, most meg ez. A t\xF3 kineveti.","Mina: You help me untangle it, and I'll give you my lucky bait.":"Mina: Seg\xEDts kibogozni, \xE9s neked adom a szerencsecsalimat.","Mina points at the water. Something huge and silver moves under the surface.":"Mina a v\xEDzre mutat. Valami hatalmas \xE9s ez\xFCst\xF6s mozog a felsz\xEDn alatt.","Mina: Every year it shows up and I never catch it. Today I just wanted someone to see it with me.":"Mina: Minden \xE9vben felt\u0171nik, \xE9s sosem siker\xFCl kifognom. Ma csak azt akartam, hogy valaki velem l\xE1ssa.","Mina: Thanks for being here. Take this \u2014 for your next big fish.":"Mina: K\xF6sz\xF6n\xF6m, hogy itt volt\xE1l. Fogadd el ezt a k\xF6vetkez\u0151 nagy halhoz.","Ben is leaning on his old fence, looking at an empty field.":"Ben a r\xE9gi ker\xEDt\xE9snek d\u0151lve n\xE9zi az \xFCres f\xF6ldet.","Ben: Forty years I farmed this. Now my knees say no and the field says yes.":"Ben: Negyven \xE9vig m\u0171veltem ezt. Most a t\xE9rdem nemet mond, a f\xF6ld meg igent.","Ben: Keep the soil good. Take this \u2014 it was always lucky for me.":"Ben: Vigy\xE1zz a f\xF6ldre. Fogadd el ezt, nekem mindig szerencs\xE9t hozott.","Ben carries a faded photo out onto the porch.":"Ben egy megs\xE1rgult f\xE9nyk\xE9pet visz ki a torn\xE1cra.","Ben: That's me and my late spouse the first spring here. The farm started as a promise.":"Ben: Ez \xE9n vagyok a n\xE9hai h\xE1zast\xE1rsammal az els\u0151 itteni tavaszon. A farm egy \xEDg\xE9retk\xE9nt indult.","Ben: You remind me of us. Please take care of this valley.":"Ben: R\xF3lunk eml\xE9keztetsz. K\xE9rlek, vigy\xE1zz erre a v\xF6lgyre.","Marlo is gutting fish on the sand and humming off key.":"Marlo a homokon tiszt\xEDtja a halat, \xE9s hamisan d\xFAdol.","Marlo: Sorry \u2014 nobody's listened to my singing in years. Not even the gulls.":"Marlo: Bocs\xE1nat, \xE9vek \xF3ta senki nem hallgatta az \xE9nekemet. M\xE9g a sir\xE1lyok sem.","Marlo: Take some of today's catch, friend. Singing is hungry work.":"Marlo: Vigy\xE9l a mai fog\xE1sb\xF3l, bar\xE1tom. Az \xE9nekl\xE9s \xE9hes munka.","Marlo stands at the shore as the sun goes down.":"Marlo a parton \xE1ll, mik\xF6zben lemegy a nap.","Marlo: The sea gave me everything, and took a boat or two. I'd do it all again.":"Marlo: A tenger mindent megadott, \xE9s elvett egy-k\xE9t cs\xF3nakot. \xDAjra v\xE9gigcsin\xE1ln\xE1m.","Marlo: Here's a pearl I found years ago. It belongs with someone who looks at the horizon.":"Marlo: Ezt a gy\xF6ngy\xF6t \xE9vekkel ezel\u0151tt tal\xE1ltam. Annak val\xF3, aki a l\xE1that\xE1rt n\xE9zi.","Dune draws a map in the sand with a stick.":"Dune egy bottal t\xE9rk\xE9pet rajzol a homokba.","Dune: The desert has no roads, only memory. I will teach you the way to the oasis.":"Dune: A sivatagnak nincsenek \xFAtjai, csak eml\xE9kezete. Megtan\xEDtom az utat az o\xE1zishoz.","Dune: Carry this. It is a small thing, but it remembers the way home.":"Dune: Vidd magaddal. Kicsis\xE9g, de eml\xE9kszik a hazafel\xE9 vezet\u0151 \xFAtra.","Dune lights a fire and the sky fills with stars.":"Dune t\xFCzet rak, \xE9s az \xE9g megtelik csillagokkal.","Dune: Where I come from, a guest who shares a fire is family.":"Dune: Ahonnan \xE9n j\xF6v\xF6k, aki megosztja a t\xFCzet, az csal\xE1d.","Dune: Take this stone. If you ever feel lost, hold it and think of the stars.":"Dune: Fogadd el ezt a k\xF6vet. Ha elt\xE9vedn\xE9l, tartsd a kezedben, \xE9s gondolj a csillagokra.","Iris kneels over a tiny seedling, shielding it from the wind.":"Iris egy par\xE1nyi pal\xE1nta f\xF6l\xE9 t\xE9rdel, \xE9s v\xE9di a sz\xE9lt\u0151l.","Iris: This one has never grown here before. I think it likes you being nearby.":"Iris: Ez m\xE9g sosem n\u0151tt itt. Szerintem szereti, hogy a k\xF6zel\xE9ben vagy.","Iris: Please accept a few of my kale seeds for your farm.":"Iris: Fogadj el p\xE1r kelk\xE1poszta-magot a farmodra.","Iris shows you a hidden clearing full of glowing flowers.":"Iris egy rejtett tiszt\xE1sra visz, tele f\xE9nyl\u0151 vir\xE1gokkal.","Iris: I've never shown anyone this. It only blooms when someone kind walks through.":"Iris: Ezt m\xE9g soha senkinek nem mutattam meg. Csak akkor ny\xEDlik, ha egy kedves ember j\xE1r erre.","Iris: Take a flower for your table. The valley is lucky to have you.":"Iris: Vigy\xE9l egy vir\xE1got az asztalodra. A v\xF6lgy szerencs\xE9s, hogy itt vagy.","Quill has crumpled pages scattered around the bench.":"Quill gy\u0171r\xF6tt lapjai szanasz\xE9t hevernek a pad k\xF6r\xFCl.","Quill: The hero walks into the tavern and then \u2014 nothing. I'm stuck on the same page.":"Quill: A h\u0151s bel\xE9p a fogad\xF3ba, \xE9s azt\xE1n... semmi. Ugyanazon az oldalon ragadtam.","Quill: Talking helped. Take this, a stolen coin from chapter two.":"Quill: A besz\xE9lget\xE9s seg\xEDtett. Fogadd el ezt, egy ellopott \xE9rm\xE9t a m\xE1sodik fejezetb\u0151l.","Quill reads aloud from a new page, voice trembling.":"Quill remeg\u0151 hangon felolvas egy \xFAj oldalt.","Quill: 'The farmer woke before dawn and the valley woke with them.' Do you like it?":"Quill: \u201EA gazda hajnal el\u0151tt kelt, \xE9s vele \xE9bredt a v\xF6lgy.\u201D Tetszik?","Quill: I wrote you into the book. Take this \u2014 you've earned your own chapter.":"Quill: Bele\xEDrtalak a k\xF6nyvbe. Fogadd el ezt, meg\xE9rdemelted a saj\xE1t fejezetedet.","Press any key to continue":"Nyomj meg egy gombot a folytat\xE1shoz","{0} gave you: {1}":"{0} ezt adta neked: {1}","Birthday gift!":"Sz\xFClet\xE9snapi aj\xE1nd\xE9k!","Today is {0}'s birthday! Gifts mean more today.":"Ma {0} sz\xFClet\xE9snapja van! Ma t\xF6bbet \xE9r az aj\xE1nd\xE9k.","A stone fountain. The villagers love to meet here.":"Egy k\u0151k\xFAt. A falusiak sz\xEDvesen tal\xE1lkoznak itt.","A street lamp. It lights up at dusk.":"Egy utcai l\xE1mpa. Alkonyatkor felgyullad.","A market stall. The stallholder is away today.":"Egy piaci stand. Az \xE1rus ma nincs itt.","The library is quiet today. Quill says the best stories are about this valley.":"A k\xF6nyvt\xE1r ma csendes. Quill szerint a legjobb t\xF6rt\xE9netek err\u0151l a v\xF6lgyr\u0151l sz\xF3lnak.","The inn: the rooms are full of sleepy travellers.":"A fogad\xF3: a szob\xE1k tele vannak \xE1lmos utaz\xF3kkal.","The smithy. Your tools are upgraded at Oliver's shop.":"A kov\xE1csm\u0171hely. Az eszk\xF6zeidet Oliver boltj\xE1ban fejlesztheted.","The clinic is closed. (Open 9:00\u201317:00)":"A rendel\u0151 z\xE1rva van. (Nyitva 9:00\u201317:00)","The nurse says you look perfectly healthy.":"A n\u0151v\xE9r szerint makkeg\xE9szs\xE9ges vagy.","A check-up costs $60.":"A vizsg\xE1lat 60 doll\xE1rba ker\xFCl.","The nurse patches you up. (-$60, health restored, +40 energy)":"A n\u0151v\xE9r \xF6sszefoltoz. (-60$, \xE9leter\u0151 helyre\xE1llt, +40 energia)","pink dots = villagers":"r\xF3zsasz\xEDn pont = falusi","1. Farm  2. Town  3. Forest  4. Beach  5. Desert  6. Island ($50)":"1. Farm  2. V\xE1ros  3. Erd\u0151  4. Part  5. Sivatag  6. Sziget (50$)","Town hall. The mayor is away on valley business.":"V\xE1rosh\xE1za. A polg\xE1rmester a v\xF6lgy \xFCgyeiben t\xE1vol van.","The museum is being restored. Bring relics from the island one day.":"A m\xFAzeum fel\xFAj\xEDt\xE1s alatt \xE1ll. Egyszer hozz majd r\xE9gis\xE9geket a szigetr\u0151l.","The post office. No letters for you today.":"A posta. Ma nincs leveled.","The clinic is open from nine to five. Don't wait until it hurts!":"A rendel\u0151 kilenct\u0151l \xF6tig nyitva. Ne v\xE1rj, am\xEDg f\xE1j!","Wash your hands and drink water, farmer.":"Moss kezet \xE9s igy\xE1l vizet, gazda.","Welcome to the valley. I'm Nora, the nurse.":"\xDCdv a v\xF6lgyben. Nora vagyok, az \xE1pol\xF3.","You look tired. Remember to eat and sleep.":"F\xE1radtnak t\u0171nsz. Ne felejts enni \xE9s aludni.","I patch up more miners than farmers, honestly.":"\u0150szint\xE9n sz\xF3lva t\xF6bb b\xE1ny\xE1szt foltozok, mint gazd\xE1t.","A bowl of soup fixes almost everything.":"Egy t\xE1l leves szinte mindent megold.","You're the only patient who brings me flowers.":"Te vagy az egyetlen beteg, aki vir\xE1got hoz nekem.","I worry about you in that mine. Be careful!":"Agg\xF3dom \xE9rted abban a b\xE1ny\xE1ban. Vigy\xE1zz!","Tea at my place after work? Doctor's orders.":"Te\xE1zunk n\xE1lam munka ut\xE1n? Orvosi utas\xEDt\xE1s.","Spring allergies keep the clinic busy.":"A tavaszi allergia lefoglalja a rendel\u0151t.","Summer sun: hat, water, shade. Please.":"Ny\xE1ri nap: kalap, v\xEDz, \xE1rny\xE9k. K\xE9rlek.","Autumn colds are on the way. Eat your vegetables.":"J\xF6nnek az \u0151szi megf\xE1z\xE1sok. Edd meg a z\xF6lds\xE9ged.","Winter is for resting. Don't skip meals.":"A t\xE9l a pihen\xE9s\xE9. Ne hagyj ki \xE9tkez\xE9st.","Nora is sorting bandages and humming a lullaby.":"Nora k\xF6tszereket rendez, \xE9s altat\xF3dalt d\xFAdol.","Nora: Oh! A long shift. Everyone seems to trip over their own boots today.":"Nora: Jaj! Hossz\xFA m\u0171szak. Ma mindenki a saj\xE1t csizm\xE1j\xE1ban botlik el.","Nora: Here, a free tonic from the clinic. Don't tell the others.":"Nora: Tess\xE9k, egy ingyen tonik a rendel\u0151b\u0151l. Ne mondd el a t\xF6bbieknek.","Nora sits on the clinic steps at dusk, staring at the sky.":"Nora alkonyatkor a rendel\u0151 l\xE9pcs\u0151j\xE9n \xFCl, \xE9s az eget n\xE9zi.","Nora: I became a nurse because my family needed one. I never asked if I wanted it. But I do.":"Nora: Az\xE9rt lettem \xE1pol\xF3, mert a csal\xE1domnak kellett egy. Sosem k\xE9rdeztem meg magamt\xF3l, akarom-e. De akarom.","Nora: Thank you for listening. Take this, you deserve it.":"Nora: K\xF6sz\xF6n\xF6m, hogy meghallgatt\xE1l. Fogadd el ezt, meg\xE9rdemled.","Hmph. Don't touch anything hot.":"Hmm. Ne \xE9rj semmi forr\xF3hoz.","Fire, iron and patience. That's the whole trade.":"T\u0171z, vas \xE9s t\xFCrelem. Ennyi az eg\xE9sz mesters\xE9g.","Need something forged? Oliver sells the upgrades.":"Kov\xE1csolni kell valamit? A fejleszt\xE9seket Oliver \xE1rulja.","Your tools look decent. For a beginner.":"Az eszk\xF6zeid eg\xE9sz j\xF3k. Kezd\u0151h\xF6z k\xE9pest.","The best ore comes from deep in the mine.":"A legjobb \xE9rc a b\xE1nya m\xE9ly\xE9n van.","A good pickaxe is worth three good days.":"Egy j\xF3 cs\xE1k\xE1ny h\xE1rom j\xF3 napot \xE9r.","You treat your tools with respect. I like that.":"Tisztelettel b\xE1nsz az eszk\xF6zeiddel. Ez tetszik.","Come by the forge any time. It's always warm.":"Gyere a m\u0171helybe b\xE1rmikor. Mindig meleg van.","I made this for you. Don't make it weird.":"Ezt neked csin\xE1ltam. Ne csin\xE1ljunk bel\u0151le \xFCgyet.","Spring: farmers break their hoes. Business is good.":"Tavasz: a gazd\xE1k elt\xF6rik a kap\xE1jukat. J\xF3 az \xFCzlet.","Summer heat plus a forge. I regret nothing.":"Ny\xE1ri h\u0151s\xE9g meg a kov\xE1csm\u0171hely. Semmit sem b\xE1nok.","Autumn is when I finally get to rest.":"\u0150sszel v\xE9gre pihenhetek.","Winter: the forge is the warmest place in the valley.":"T\xE9l: a m\u0171hely a v\xF6lgy legmelegebb helye.","Hugo hammers a glowing blade and stops when he sees you.":"Hugo egy izz\xF3 peng\xE9t kalap\xE1l, \xE9s meg\xE1ll, amikor megl\xE1t.","Hugo: Eh, don't stand so close. Sparks.":"Hugo: Ne \xE1llj olyan k\xF6zel. Szikr\xE1k.","Hugo: Take this. It's a scrap of gold from a failed project.":"Hugo: Fogd. Egy aranydarab egy f\xE9lresiker\xFClt munk\xE1b\xF3l.","Hugo shows you a dusty anvil in the back room.":"Hugo egy poros \xFCll\u0151t mutat a h\xE1ts\xF3 szob\xE1ban.","Hugo: My father's. I haven't lit this fire in years. It felt wrong to do it alone.":"Hugo: Az ap\xE1m\xE9. \xC9vek \xF3ta nem gy\xFAjtottam be. Rossz \xE9rz\xE9s volt egyed\xFCl megtenni.","Hugo: You made it feel right. Take this, and thank you.":"Hugo: Neked k\xF6sz\xF6nhet\u0151en j\xF3 \xE9rz\xE9s volt. Fogadd el ezt, \xE9s k\xF6sz\xF6n\xF6m.","Please keep your voice down. Well, we're outside. Fine.":"K\xE9rlek, halkabban. \xC1, kint vagyunk. Mindegy.","Welcome! The library has a book on every crop.":"\xDCdv! A k\xF6nyvt\xE1rban minden term\xE9nyr\u0151l van k\xF6nyv.","I run the library. Ask me anything. Quietly.":"\xC9n vezetem a k\xF6nyvt\xE1rat. K\xE9rdezz b\xE1rmit. Halkan.","You read more than most farmers. I approve.":"T\xF6bbet olvasol, mint a legt\xF6bb gazda. Helyeslem.","There's an old book about the island treasure.":"Van egy r\xE9gi k\xF6nyv a sziget kincs\xE9r\u0151l.","I keep a shelf of valley history just for you.":"Egy polcnyi v\xF6lgyt\xF6rt\xE9netet tartogatok neked.","I saved the last chapter of the serial for you.":"F\xE9lretettem neked a folytat\xE1sos reg\xE9ny utols\xF3 fejezet\xE9t.","Reading next to you is my favourite part of the week.":"A h\xE9t kedvenc r\xE9sze, amikor melletted olvashatok.","I'd read to you every evening, if you'd let me.":"Minden este felolvasn\xE9k neked, ha hagyn\xE1d.","Spring is for gardening books. Stop by!":"A tavasz a kert\xE9szeti k\xF6nyvek ideje. N\xE9zz be!","Summer reads: adventure, ice tea, shade.":"Ny\xE1ri olvasm\xE1ny: kaland, jegestea, \xE1rny\xE9k.","Autumn is cosy-mystery weather.":"Az \u0151sz a hangulatos krimik ideje.","Winter nights, a blanket and a long novel.":"T\xE9li est\xE9k, egy takar\xF3 \xE9s egy hossz\xFA reg\xE9ny.","Lena is balancing a tower of books and a cup of tea.":"Lena egy k\xF6nyvtornyot \xE9s egy cs\xE9sze te\xE1t egyens\xFAlyoz.","Lena: Oh, don't mind the mess. I'm reorganising by mood now.":"Lena: Ne t\xF6r\u0151dj a rendetlens\xE9ggel. Most hangulat szerint rendezem \xE1t.","Lena: A bookmark for you. It's hand-painted. Please treat it kindly.":"Lena: Egy k\xF6nyvjelz\u0151 neked. K\xE9zzel festett. K\xE9rlek, b\xE1nj vele kedvesen.","Lena closes the library early and lights a small lantern.":"Lena kor\xE1n bez\xE1rja a k\xF6nyvt\xE1rat, \xE9s meggy\xFAjt egy kis l\xE1mp\xE1st.","Lena: There's a poem in the margins of the oldest book here. I think it was left for whoever needed it.":"Lena: A legr\xE9gebbi k\xF6nyv marg\xF3j\xE1n van egy vers. Szerintem annak hagyt\xE1k, akinek sz\xFCks\xE9ge van r\xE1.","Lena: It's yours now. Take this, as a thank-you.":"Lena: Most a ti\xE9d. Fogadd el ezt k\xF6sz\xF6netk\xE9nt.","The museum is under restoration. Pardon the dust.":"A m\xFAzeum fel\xFAj\xEDt\xE1s alatt \xE1ll. Eln\xE9z\xE9st a port\xF3l.","Everything has a story if you look closely.":"Mindennek van t\xF6rt\xE9nete, ha k\xF6zelebbr\u0151l megn\xE9zed.","I'm Theo. I look after the museum, such as it is.":"Theo vagyok. \xC9n gondozom a m\xFAzeumot, m\xE1r amilyen.","Bring me anything old. I will not ask where you found it.":"Hozz b\xE1rmi r\xE9git. Nem k\xE9rdezem meg, hol tal\xE1ltad.","A relic from the island? Marvellous.":"R\xE9gis\xE9g a szigetr\u0151l? Csod\xE1latos.","The valley is older than it looks.":"A v\xF6lgy r\xE9gebbi, mint amilyennek l\xE1tszik.","You've made my museum a better place already.":"M\xE1r most jobb helly\xE9 tetted a m\xFAzeumomat.","Your finds will have their own display case.":"A leleteidnek k\xFCl\xF6n vitrinje lesz.","I'd be honoured to show you the back rooms.":"Megtiszteln\xE9l, ha megmutathatn\xE1m a h\xE1ts\xF3 termeket.","Spring: the digs begin again.":"Tavasz: \xFAjra kezd\u0151dnek az \xE1sat\xE1sok.","Summer: tourists, sunburn and old pots.":"Ny\xE1r: turist\xE1k, le\xE9g\xE9s \xE9s r\xE9gi cserepek.","Autumn light is best for photographing relics.":"Az \u0151szi f\xE9ny a legjobb a r\xE9gis\xE9gek f\xE9nyk\xE9pez\xE9s\xE9hez.","Winter: the museum is quiet, and so am I.":"T\xE9l: a m\xFAzeum csendes, \xE9s \xE9n is.","Theo is dusting a clay pot with a tiny brush.":"Theo egy agyaged\xE9nyt porolgat egy apr\xF3 ecsettel.","Theo: This is eight hundred years old. And I broke it. Twice.":"Theo: Ez nyolcsz\xE1z \xE9ves. \xC9s \xE9n elt\xF6rtem. K\xE9tszer.","Theo: Take this coin, it's from the same dig. It's lucky.":"Theo: Fogd ezt az \xE9rm\xE9t, ugyanabb\xF3l az \xE1sat\xE1sb\xF3l val\xF3. Szerencs\xE9t hoz.","Theo unrolls an old map across the museum floor.":"Theo egy r\xE9gi t\xE9rk\xE9pet g\xF6ngy\xF6l ki a m\xFAzeum padl\xF3j\xE1n.","Theo: The island holds more than a few buried coins. Someone once lived there, you know.":"Theo: A sziget t\xF6bbet rejt n\xE9h\xE1ny el\xE1sott \xE9rm\xE9n\xE9l. Tudod, valaki valaha ott \xE9lt.","Theo: Take this. And promise to bring me every strange thing you find.":"Theo: Fogadd el ezt. \xC9s \xEDg\xE9rd meg, hogy elhozol nekem minden furcsas\xE1got, amit tal\xE1lsz.",Nurse:"\xC1pol\xF3",Blacksmith:"Kov\xE1cs",Librarian:"K\xF6nyvt\xE1ros",Curator:"M\xFAzeumi gondnok","Rosa & Oliver's home":"Rosa \xE9s Oliver otthona","Ben & Iris's home":"Ben \xE9s Iris otthona","Marlo & Mina's home":"Marlo \xE9s Mina otthona","Nora & Hugo's home":"Nora \xE9s Hugo otthona","Theo & Lena's home":"Theo \xE9s Lena otthona","Quill's home":"Quill otthona","Dune's home":"Dune otthona","The door is locked. (Visit between 8:00 and 22:00)":"Az ajt\xF3 z\xE1rva. (L\xE1togass 8:00 \xE9s 22:00 k\xF6z\xF6tt)","You can visit the villagers' homes between 8:00 and 22:00. Residents are home when they aren't out in the village.":"A falusiak otthonait 8:00 \xE9s 22:00 k\xF6z\xF6tt l\xE1togathatod. A lak\xF3k otthon vannak, amikor nincsenek a faluban.","It's late \u2014 you say goodnight and head out.":"K\xE9s\u0151 van \u2014 j\xF3 \xE9jszak\xE1t k\xEDv\xE1nsz, \xE9s kil\xE9psz az ajt\xF3n.","A neatly made bed. It isn't yours.":"Egy gondosan megvetett \xE1gy. Nem a ti\xE9d.","A warm fire crackles in the hearth.":"Meleg t\u0171z pattog a kandall\xF3ban.","Family: {0} ({1})":"Csal\xE1d: {0} ({1})",brother:"fiv\xE9re",sister:"n\u0151v\xE9re",granddaughter:"unok\xE1ja",grandfather:"nagyapja",daughter:"l\xE1nya",father:"apja",niece:"unokah\xFAga",uncle:"nagyb\xE1tyja","Oliver pretends he doesn't like my pastries, yet he eats half the tray.":"Oliver \xFAgy tesz, mintha nem szeretn\xE9 a s\xFCtem\xE9nyeimet, m\xE9gis megeszi a f\xE9l t\xE1lc\xE1t.","Rosa bakes, I count the coins. It's a family business, really.":"Rosa s\xFCt, \xE9n a p\xE9nzt sz\xE1molom. Tulajdonk\xE9ppen csal\xE1di v\xE1llalkoz\xE1s.","Iris is always in the woods. She gets that from her grandmother.":"Iris mindig az erd\u0151ben van. Ezt a nagyanyj\xE1t\xF3l \xF6r\xF6k\xF6lte.","Grandpa Ben tells the same farm stories every spring. I love them.":"Ben nagyapa minden tavasszal ugyanazokat a farmos t\xF6rt\xE9neteket mes\xE9li. Im\xE1dom \u0151ket.","Mina caught a bigger fish than me last week. I'm still proud. Mostly.":"Mina m\xFAlt h\xE9ten nagyobb halat fogott n\xE1lam. M\xE9g mindig b\xFCszke vagyok. T\xF6bbnyire.","Dad says I fish like my mother. It's the best compliment.":"Apa szerint \xFAgy horg\xE1szom, mint any\xE1m. Ez a legszebb dics\xE9ret.","Hugo works too hard. Make sure he eats something warm.":"Hugo t\xFAl sokat dolgozik. Figyelj r\xE1, hogy egyen valami meleget.","My sister fusses over me. I pretend to hate it.":"A n\u0151v\xE9rem folyton agg\xF3dik \xE9rtem. \xDAgy teszek, mintha ut\xE1ln\xE1m.","Lena has dragged half the museum's relics into her library. Don't tell her I know.":"Lena a m\xFAzeum r\xE9gis\xE9geinek fel\xE9t \xE1tcipelte a k\xF6nyvt\xE1r\xE1ba. Ne mondd el neki, hogy tudom.","Uncle Theo tells me everything old is precious. Even his jokes.":"Theo b\xE1csi szerint minden r\xE9gi dolog \xE9rt\xE9kes. M\xE9g a viccei is.","Something smells delicious.":"Valami nagyon finom illata van.","A tall mirror. You look good today.":"Egy magas t\xFCk\xF6r. Ma j\xF3l n\xE9zel ki.","Living Room":"Nappali",Study:"Dolgoz\xF3szoba",Workshop:"M\u0171hely","Stove and fridge. Dishes restore 25% more energy.":"T\u0171zhely \xE9s h\u0171t\u0151. Az \xE9telek 25%-kal t\xF6bb energi\xE1t adnak.","Double bed. A spouse makes you breakfast.":"Francia\xE1gy. A h\xE1zast\xE1rsad reggelit k\xE9sz\xEDt.","A cool cellar with a huge storage chest.":"H\u0171v\xF6s pince hatalmas t\xE1rol\xF3l\xE1d\xE1val.","Sofa: rest once a day for +20 energy.":"Kanap\xE9: naponta egyszer pihenj +20 energi\xE1\xE9rt.","Desk: read once a day for skill XP.":"\xCDr\xF3asztal: naponta egyszer olvass k\xE9pess\xE9g-XP-\xE9rt.","Bench: craft artisan machines at home.":"Munkapad: k\xE9sz\xEDts k\xE9zm\u0171ves g\xE9peket otthon.","A cosy living room with a sofa. Resting on it restores energy once a day.":"Hangulatos nappali kanap\xE9val. Rajta pihenve naponta egyszer energi\xE1t nyersz vissza.","A quiet study with a desk. Reading there once a day gives skill XP.":"Csendes dolgoz\xF3szoba \xEDr\xF3asztallal. Olvas\xE1ssal naponta egyszer k\xE9pess\xE9g-XP-t szerezhetsz.","A workshop with a crafting bench for artisan machines.":"M\u0171hely munkapaddal a k\xE9zm\u0171ves g\xE9pek k\xE9sz\xEDt\xE9s\xE9hez.","You already rested today.":"Ma m\xE1r pihent\xE9l.","You are not tired.":"Nem vagy f\xE1radt.","You relax on the sofa. (+20 energy)":"Pihensz a kanap\xE9n. (+20 energia)","You already read today.":"Ma m\xE1r olvast\xE1l.","You read a book about {0}. (+25 xp)":"Olvast\xE1l egy k\xF6nyvet err\u0151l: {0}. (+25 xp)","WORKBENCH  (craft machines from materials)  E: close":"MUNKAPAD  (g\xE9pek k\xE9sz\xEDt\xE9se alapanyagb\xF3l)  E: bez\xE1r","Need something built? You've come to the right place.":"\xC9p\xEDteni kell valamit? J\xF3 helyen j\xE1rsz.","Measure twice, cut once. That's my motto.":"K\xE9tszer m\xE9rj, egyszer v\xE1gj. Ez a mott\xF3m.","I'm Hazel, the carpenter. I build whatever the valley needs.":"Hazel vagyok, az \xE1cs. Azt \xE9p\xEDtem, amire a v\xF6lgynek sz\xFCks\xE9ge van.","Your farm has good bones. Let's give it some walls.":"A farmodnak j\xF3 adotts\xE1gai vannak. Adjunk neki falakat.","Good timber is hard to find. Bring me wood and I'll make magic.":"J\xF3 f\xE1t neh\xE9z tal\xE1lni. Hozz f\xE1t, \xE9s csod\xE1t m\u0171velek.","I've built half the houses in this town.":"A v\xE1ros h\xE1zainak fel\xE9t \xE9n \xE9p\xEDtettem.","You're my favourite client. Don't tell the others.":"Te vagy a kedvenc megrendel\u0151m. Ne mondd el a t\xF6bbieknek.","I drew up a plan for your farm. Come see it!":"Terveket rajzoltam a farmodhoz. Gyere, n\xE9zd meg!","Sawdust in my hair and I'm happy. Funny, isn't it?":"F\u0171r\xE9szpor a hajamban, \xE9s boldog vagyok. Vicces, nem?","Spring is when everyone wants a new barn.":"Tavasszal mindenki \xFAj ist\xE1ll\xF3t akar.","Summer is for sanding porches in the shade.":"A ny\xE1r a torn\xE1cok csiszol\xE1s\xE1\xE9, \xE1rny\xE9kban.","Autumn: last chance to build before the frost.":"\u0150sz: az utols\xF3 es\xE9ly \xE9p\xEDteni a fagy el\u0151tt.","Winter: the workshop is warm and smells of pine.":"T\xE9l: a m\u0171hely meleg, \xE9s feny\u0151illat\xFA.","Hazel is staring at a crooked shelf with her arms crossed.":"Hazel \xF6sszefont karral b\xE1mul egy g\xF6rbe polcot.","Hazel: I built that at midnight. In my defence, it was dark.":"Hazel: \xC9jf\xE9lkor \xE9p\xEDtettem. A ments\xE9gemre, s\xF6t\xE9t volt.","Hazel: Take some planks. I've got too many and no more shelves.":"Hazel: Vigy\xE9l p\xE1r deszk\xE1t. T\xFAl sok van, \xE9s m\xE1r nincs t\xF6bb polcom.","Hazel unrolls a blueprint on the counter, with a tiny drawing of a cabin.":"Hazel kiter\xEDt egy tervrajzot a pulton, egy apr\xF3 fah\xE1zzal.","Hazel: I always wanted to build a house for someone I care about. I'm still drawing it.":"Hazel: Mindig szerettem volna h\xE1zat \xE9p\xEDteni valakinek, akit szeretek. M\xE9g rajzolom.","Hazel: Take this for your next project. You inspire me.":"Hazel: Fogadd el ezt a k\xF6vetkez\u0151 projektedhez. Inspir\xE1lsz.",Carpenter:"\xC1cs","Hazel's Carpentry":"Hazel \xE1csm\u0171helye",Buildings:"\xC9p\xFCletek",Carpentry:"\xC1csm\u0171hely","CARPENTER  $":"\xC1CS  $","The carpentry is closed. (Open 9:00\u201317:00)":"Az \xE1csm\u0171hely z\xE1rva. (Nyitva 9:00\u201317:00)","Hazel is not here right now.":"Hazel most nincs itt.","You can visit Hazel's carpentry between 9:00 and 17:00. Buy farm buildings and house upgrades there.":"Hazel \xE1csm\u0171hely\xE9t 9:00 \xE9s 17:00 k\xF6z\xF6tt l\xE1togathatod. Itt vehetsz gazdas\xE1gi \xE9p\xFCleteket \xE9s h\xE1zfejleszt\xE9seket.","It's closing time \u2014 you say goodbye and head out.":"Z\xE1r\xF3r\xE1hoz k\xF6zeledik az id\u0151 \u2014 elk\xF6sz\xF6nsz, \xE9s kil\xE9psz.","3. Buildings & house":"3. \xC9p\xFCletek \xE9s h\xE1z","Wood shelves, planks and sawdust. Everything smells of fresh pine.":"Fapolcok, deszk\xE1k \xE9s f\u0171r\xE9szpor. Minden friss feny\u0151illat\xFA.","Empty plot \u2014 ask Hazel the carpenter to build a {0} (town, 9:00-17:00).":"\xDCres telek \u2014 k\xE9rd meg Hazelt, az \xE1csot, hogy \xE9p\xEDtsen egy {0} (v\xE1ros, 9:00-17:00).","The Town has a shop (seeds, upgrades, animals), Hazel the carpenter (farm buildings, house upgrades), a quest board and villagers to befriend.":"A v\xE1rosban van bolt (magok, fejleszt\xE9sek, \xE1llatok), Hazel az \xE1cs (\xE9p\xFCletek, h\xE1zfejleszt\xE9sek), k\xFCldet\xE9st\xE1bla \xE9s falusiak, akikkel bar\xE1tkozhatsz.","Press Tab to flip pages: seeds, tool upgrades, animals and gifts. Farm buildings and house upgrades are sold by Hazel the carpenter.":"Tab: lapoz\xE1s \u2014 magok, eszk\xF6zfejleszt\xE9sek, \xE1llatok, aj\xE1nd\xE9kok. Az \xE9p\xFCleteket \xE9s h\xE1zfejleszt\xE9seket Hazel, az \xE1cs \xE1rulja.","Hazel builds farm buildings and house upgrades. Press Tab to flip pages: buildings, house, workshop.":"Hazel gazdas\xE1gi \xE9p\xFCleteket \xE9s h\xE1zfejleszt\xE9seket \xE9p\xEDt. Tab: lapoz\xE1s \u2014 \xE9p\xFCletek, h\xE1z, m\u0171hely.",CARPENTER:"\xC1CS","A well-stocked fridge.":"J\xF3l megrakott h\u0171t\u0151.","Papers and books cover the desk.":"Pap\xEDrok \xE9s k\xF6nyvek bor\xEDtj\xE1k az asztalt.","The bakery door bursts open. Smoke pours out, followed by Oliver carrying a tray.":"A p\xE9ks\xE9g ajtaja kiv\xE1g\xF3dik. F\xFCst \xE1rad ki, m\xF6g\xF6tte Oliver egy t\xE1lc\xE1val.","Oliver: Rosa! Your caramel is on fire again!":"Oliver: Rosa! Megint l\xE1ngol a karamell\xE1d!","Rosa: It is not on fire. It's... dramatically toasted.":"Rosa: Nem l\xE1ngol. Csak... dr\xE1maian megpirult.","Oliver: Dramatically toasted is a polite word for burnt.":"Oliver: A dr\xE1maian megpirult az oda\xE9gett udvarias neve.","Rosa: You decide, farmer. Is a little char a crime?":"Rosa: Te d\xF6nt\xF6d el, gazda. B\u0171n egy kis \xE9getett \xEDz?","You: Add a pinch of salt and call it a speciality.":"Te: Tegy\xE9l bele egy csipet s\xF3t, \xE9s nevezd k\xFCl\xF6nlegess\xE9gnek.","Rosa: Salted caramel! Oliver, write that on the board!":"Rosa: S\xF3s karamell! Oliver, \xEDrd fel a t\xE1bl\xE1ra!","From that day on, 'dramatically toasted' was the bakery's best seller.":"Att\xF3l a napt\xF3l a \u201Edr\xE1maian megpirult\u201D volt a p\xE9ks\xE9g sl\xE1gere.","Rosa waits for you outside the bakery at sunset, holding a small wrapped loaf.":"Rosa naplementekor a p\xE9ks\xE9g el\u0151tt v\xE1r, kez\xE9ben egy kis becsomagolt cip\xF3val.","Rosa: I never told anyone why I came to this valley.":"Rosa: Soha senkinek nem mondtam el, mi\xE9rt j\xF6ttem ebbe a v\xF6lgybe.","Rosa: I was a city baker. Every day the same queue, and nobody ever said thank you.":"Rosa: V\xE1rosi p\xE9k voltam. Minden nap ugyanaz a sor, \xE9s soha senki nem k\xF6sz\xF6nte meg.","Rosa: Then you ate my first burnt loaf and asked for a second.":"Rosa: Azt\xE1n megetted az els\u0151 oda\xE9gett cip\xF3mat, \xE9s k\xE9rt\xE9l m\xE9g egyet.","Rosa: This valley became home because of people like you. Thank you.":"Rosa: Ez a v\xF6lgy az otthonomm\xE1 lett olyan emberek miatt, mint te. K\xF6sz\xF6n\xF6m.","The loaf is still warm.":"A cip\xF3 m\xE9g meleg.","Mina sits on the dock, rod trembling, eyes locked on the water.":"Mina a st\xE9gen \xFCl, remeg a horg\xE1szbotja, szeme a vizet figyeli.","Mina: Shh! Don't move. It's here. The silver one.":"Mina: Pszt! Ne mozdulj. Itt van. Az ez\xFCst\xF6s.","A huge splash, and Mina is soaked from head to toe.":"Hatalmas csobban\xE1s, \xE9s Mina tet\u0151t\u0151l talpig csuromvizes.","Mina: It got away... again.":"Mina: Megint elsz\xF6k\xF6tt...","Mina: But I'm laughing, so I guess it was a good day.":"Mina: De nevetek, sz\xF3val j\xF3 nap volt.","Mina hands you a worn fishing rod wrapped in cloth.":"Mina egy kopott, ruh\xE1ba csavart horg\xE1szbotot ny\xFAjt fel\xE9d.","Mina: This was my grandfather's first rod. I caught my first fish with it, and my first disappointment.":"Mina: Ez volt a nagyap\xE1m els\u0151 botja. Ezzel fogtam az els\u0151 halamat \xE9s az els\u0151 csal\xF3d\xE1somat.","Mina: I want you to have it. Not to use. To remember that patience is a kind of friendship.":"Mina: Szeretn\xE9m, ha n\xE1lad lenne. Nem haszn\xE1latra, hanem hogy eml\xE9kezz: a t\xFCrelem a bar\xE1ts\xE1g egyik form\xE1ja.","Mina: Cast something far for me, okay?":"Mina: Dobj el nekem valamit nagyon messzire, j\xF3?","Ben is repainting a worn-out scarecrow in front of his house.":"Ben egy kopott mad\xE1rijeszt\u0151t fest \xFAjra a h\xE1za el\u0151tt.","Ben: Forty summers it's guarded my field. Never lost a single crow fight.":"Ben: Negyven ny\xE1ron \xE1t \u0151rizte a f\xF6ldemet. Egyetlen varj\xFAcsat\xE1t sem vesztett.","Ben: Iris says it's creepy. I say it's loyal.":"Ben: Iris szerint ijeszt\u0151. \xC9n szerintem h\u0171s\xE9ges.","Ben: Hold the ladder, farmer.":"Ben: Fogd a l\xE9tr\xE1t, gazda.","You hold the ladder while Ben fixes the scarecrow's hat.":"Fogod a l\xE9tr\xE1t, am\xEDg Ben megigaz\xEDtja a mad\xE1rijeszt\u0151 kalapj\xE1t.","Ben: There. Good as new. Almost as handsome as me.":"Ben: \xCDgy. Mint az \xFAj. Majdnem olyan helyes, mint \xE9n.","Ben presses an old key into your hand as the sun sets over his empty field.":"Ben egy r\xE9gi kulcsot nyom a kezedbe, mik\xF6zben a nap lenyugszik az \xFCres f\xF6ldje f\xF6l\xF6tt.","Ben: This opens the old shed behind my house. It's yours now.":"Ben: Ez nyitja a h\xE1z m\xF6g\xF6tti r\xE9gi f\xE9szert. Mostant\xF3l a ti\xE9d.","Ben: I won't be farming much longer, but this valley needs hands like yours.":"Ben: \xC9n m\xE1r nem sok\xE1ig gazd\xE1lkodom, de ennek a v\xF6lgynek olyan kezek kellenek, mint a ti\xE9d.","Ben: Promise me the scarecrow stays.":"Ben: \xCDg\xE9rd meg, hogy a mad\xE1rijeszt\u0151 marad.","You: I promise.":"Te: Meg\xEDg\xE9rem.","Ben: Good. Then I can rest easy.":"Ben: J\xF3. Akkor nyugodtan pihenhetek.","Iris kneels beside a seedling that glows faintly in the shade.":"Iris egy \xE1rny\xE9kban halv\xE1nyan vil\xE1g\xEDt\xF3 pal\xE1nta mell\xE9 t\xE9rdel.","Iris: Look. It only opens when it hears someone laugh.":"Iris: N\xE9zd. Csak akkor ny\xEDlik ki, ha valakit nevetni hall.","Iris: Go on, farmer. Tell it a joke.":"Iris: Hajr\xE1, gazda. Mes\xE9lj neki egy viccet.","You: Why did the turnip blush? It saw the salad dressing!":"Te: Mi\xE9rt pirult el a r\xE9pa? Megl\xE1tta a sal\xE1ta\xF6ntetet!","Iris: ...That was terrible.":"Iris: ...Ez borzaszt\xF3 volt.","The bloom opens anyway.":"A vir\xE1g m\xE9gis kiny\xEDlik.","Iris: It likes you.":"Iris: Kedvel t\xE9ged.","Iris leads you into a clearing where hundreds of flowers glow in the dark.":"Iris egy tiszt\xE1sra vezet, ahol sz\xE1z\xE1val vil\xE1g\xEDtanak a vir\xE1gok a s\xF6t\xE9tben.","Iris: Grandpa Ben planted the first ones. I only learned to keep them alive.":"Iris: Ben nagyapa \xFCltette az els\u0151ket. \xC9n csak megtanultam \xE9letben tartani \u0151ket.","Iris: Every spring I plant one more. This year, I'd like to plant one with you.":"Iris: Minden tavasszal \xFCltetek egyet. Id\xE9n veled szeretn\xE9k.","You kneel together and plant a single glowing seed.":"Egy\xFCtt let\xE9rdeltek, \xE9s el\xFCltettek egyetlen vil\xE1g\xEDt\xF3 magot.","Iris: Now the valley has a little bit of both of us.":"Iris: Most a v\xF6lgyben van egy kicsi mindkett\u0151nkb\u0151l.","Quill paces in circles, muttering into a notebook.":"Quill k\xF6rbe-k\xF6rbe j\xE1rk\xE1l, \xE9s a jegyzetf\xFCzet\xE9be motyog.","Quill: Chapter two. The farmer walks into the forest. And then... nothing!":"Quill: M\xE1sodik fejezet. A gazda bel\xE9p az erd\u0151be. \xC9s azt\xE1n... semmi!","Quill: What would you do, truly?":"Quill: Te mit tenn\xE9l igaz\xE1n?","You: Pick up a strange glowing flower.":"Te: Felvenn\xE9k egy furcsa, vil\xE1g\xEDt\xF3 vir\xE1got.","Quill: A glowing flower! Yes! But what is it for?":"Quill: Egy vil\xE1g\xEDt\xF3 vir\xE1g! Igen! De mire j\xF3?","You: It opens when you tell it a joke.":"Te: Akkor ny\xEDlik ki, ha viccet mes\xE9lsz neki.","Quill: ...I'm writing that down.":"Quill: ...Ezt fel\xEDrom.","Quill hands you a thick bound book. The cover reads: Tiny Valley.":"Quill egy vastag k\xF6t\xF6tt k\xF6nyvet ad. A bor\xEDt\xF3n ez \xE1ll: Tiny Valley.","Quill: It's finished. Every chapter, every festival, every burnt loaf.":"Quill: K\xE9sz. Minden fejezet, minden fesztiv\xE1l, minden oda\xE9gett cip\xF3.","Quill: You're on every page. I hope that's all right.":"Quill: Minden oldalon szerepelsz. Rem\xE9lem, ez rendben van.","You: It's perfect.":"Te: T\xF6k\xE9letes.","Quill: Then thank you for being the story.":"Quill: Akkor k\xF6sz\xF6n\xF6m, hogy te volt\xE1l a t\xF6rt\xE9net.","The whole village gathers outside the restored community centre.":"Az eg\xE9sz falu \xF6sszegy\u0171lik a fel\xFAj\xEDtott k\xF6z\xF6ss\xE9gi h\xE1z el\u0151tt.","Oliver: I've stocked that shop for years and never seen the valley so alive.":"Oliver: \xC9vek \xF3ta t\xF6lt\xF6m azt a boltot, de a v\xF6lgy m\xE9g sosem volt ilyen \xE9lettel teli.","Rosa: I baked a pie for everyone. Don't ask how many burnt ones I made.":"Rosa: Mindenkinek s\xFCt\xF6ttem pit\xE9t. Ne k\xE9rdezd, h\xE1nyat \xE9gettem oda.","Ben: Forty years I waited to see this place open again.":"Ben: Negyven \xE9vig v\xE1rtam, hogy \xFAjra megny\xEDljon ez a hely.","Mina: Even the fish are celebrating. I can tell.":"Mina: M\xE9g a halak is \xFCnnepelnek. \xC9rzem.","Iris: Every flower in the valley is blooming today.":"Iris: Ma a v\xF6lgy minden vir\xE1ga ny\xEDlik.","Quill: This is the final chapter. Or the first of a new one.":"Quill: Ez az utols\xF3 fejezet. Vagy egy \xFAjnak az els\u0151.","You hold the key to the community centre as the whole village cheers.":"A kezedben a k\xF6z\xF6ss\xE9gi h\xE1z kulcsa, mik\xF6zben az eg\xE9sz falu \xE9ljenez.","Esc: skip":"Esc: \xE1tugr\xE1s",Bakery:"P\xE9ks\xE9g",BAKERY:"P\xC9KS\xC9G","Rosa's Bakery":"Rosa p\xE9ks\xE9ge",Bread:"Keny\xE9r",bread:"keny\xE9r","Bread (+35 energy)":"Keny\xE9r (+35 energia)","Pancakes (+50 energy)":"Palacsinta (+50 energia)","Pumpkin Pie (+80 energy)":"S\xFCt\u0151t\xF6k\xF6s pite (+80 energia)","Cornbread (+60 energy)":"Kukoricakeny\xE9r (+60 energia)","{0} is closed. (Open {1}:00\u2013{2}:00)":"{0} z\xE1rva van. (Nyitva {1}:00\u2013{2}:00)","{0} is not here right now.":"{0} most nincs itt.","You can walk into the shops in town between 9:00 and 17:00: Hazel the carpenter (buildings, house upgrades) and Rosa's bakery (food).":"A v\xE1ros boltjaiba 9:00 \xE9s 17:00 k\xF6z\xF6tt l\xE9phetsz be: Hazel az \xE1cs (\xE9p\xFCletek, h\xE1zfejleszt\xE9sek) \xE9s Rosa p\xE9ks\xE9g (\xE9tel).","Oliver's General Store":"Oliver vegyesboltja","E: enter shop":"E: bel\xE9p\xE9s a boltba","E: enter":"E: bel\xE9p\xE9s","Multiplayer \u2014 2 players, peer to peer":"T\xF6bbj\xE1t\xE9kos \u2014 2 j\xE1t\xE9kos, k\xF6zvetlen kapcsolat","Host a game":"J\xE1t\xE9k ind\xEDt\xE1sa","Join a game":"Csatlakoz\xE1s",Close:"Bez\xE1r",Back:"Vissza",Copy:"M\xE1sol\xE1s",Connect:"Csatlakoz","Create reply":"V\xE1lasz k\xE9sz\xEDt\xE9se",Send:"K\xFCld\xE9s","Send gift":"Aj\xE1nd\xE9k k\xFCld\xE9se",Disconnect:"Kapcsolat bont\xE1sa","Play together: walk around the village side by side, chat and trade items. No server needed \u2014 you swap two short codes.":"J\xE1tsszatok egy\xFCtt: s\xE9t\xE1ljatok egym\xE1s mellett a faluban, csevegjetek \xE9s cser\xE9ljetek t\xE1rgyakat. Szerver nem kell \u2014 k\xE9t r\xF6vid k\xF3dot cser\xE9ltek.","Both players need this game open. Works over the internet in most cases; very strict networks may block it.":"Mindk\xE9t j\xE1t\xE9kosnak nyitva kell lennie a j\xE1t\xE9knak. Az interneten \xE1t legt\xF6bbsz\xF6r m\u0171k\xF6dik; nagyon szigor\xFA h\xE1l\xF3zatok blokkolhatj\xE1k.","1. Copy your code and send it to your friend.":"1. M\xE1sold ki a k\xF3dodat, \xE9s k\xFCldd el a bar\xE1todnak.","2. Paste your friend's reply code:":"2. Illeszd be a bar\xE1tod v\xE1laszk\xF3dj\xE1t:","2. Paste your friend's reply code here":"2. Illeszd be ide a bar\xE1tod v\xE1laszk\xF3dj\xE1t","1. Paste the host's code:":"1. Illeszd be a h\xE1zigazda k\xF3dj\xE1t:","Paste the host's code here":"Illeszd be ide a h\xE1zigazda k\xF3dj\xE1t","2. Send this reply to the host:":"2. K\xFCldd el ezt a v\xE1laszt a h\xE1zigazd\xE1nak:","Creating your code\u2026":"K\xF3d k\xE9sz\xEDt\xE9se\u2026","Send this code to your friend, then paste their reply below.":"K\xFCldd el ezt a k\xF3dot a bar\xE1todnak, majd illeszd be lent a v\xE1lasz\xE1t.","Could not start: ":"Nem siker\xFClt elind\xEDtani: ","Creating the reply\u2026":"V\xE1lasz k\xE9sz\xEDt\xE9se\u2026","Send this reply code to the host. The game connects when they paste it.":"K\xFCldd el ezt a v\xE1laszk\xF3dot a h\xE1zigazd\xE1nak. Amint beilleszti, l\xE9trej\xF6n a kapcsolat.","That code did not work.":"Ez a k\xF3d nem m\u0171k\xF zz a farmh\xE1zadban \u2014 E az ajt\xF3n\xE1l.","You're the best thing to happen to this town.":"Te vagy a legjobb, ami ezzel a v\xE1rossal t\xF6rt\xE9nhetett.","Come by the bakery any time \u2014 there's always a seat for you.":"N\xE9zz be a p\xE9ks\xE9gbe b\xE1rmikor \u2014 mindig van egy hely neked.","I saved you a loaf. Don't tell Oliver.":"F\xE9lretettem neked egy cip\xF3t. Ne \xE1ruld el Olivernek.","Spring means daffodils. My favorite!":"A tavasz a n\xE1rciszokat jelenti. A kedvencem!","Summer tomatoes make the sweetest sauce.":"A ny\xE1ri paradicsomb\xF3l lesz a leg\xE9desebb sz\xF3sz.","Autumn pumpkins... perfection.":"Az \u0151szi s\xFCt\u0151t\xF6k... t\xF6k\xE9letes.","Cabbage and kale survive winter.":"A k\xE1poszta \xE9s a kelk\xE1poszta \xE1tv\xE9szeli a telet.","Welcome to the shop. Seeds and upgrades inside.":"\xDCdv a boltban. Bent magok \xE9s fejleszt\xE9sek vannak.","Out-of-season crops wither when the season changes. Plan ahead.":"A szezonon k\xEDv\xFCli n\xF6v\xE9nyek elsz\xE1radnak \xE9vszakv\xE1lt\xE1skor. Tervezz el\u0151re.","Upgrades need ore from the mine. Bring copper!":"A fejleszt\xE9sekhez \xE9rc kell a b\xE1ny\xE1b\xF3l. Hozz rezet!","Upgrade your hoe and can to work several tiles at once.":"Fejleszd a kap\xE1t \xE9s a kann\xE1t, hogy egyszerre t\xF6bb mez\u0151n dolgozz.","Chickens lay eggs every night. Cheap income!":"A ty\xFAkok minden \xE9jjel tojnak. Olcs\xF3 bev\xE9tel!","I've been saving the good seeds for you.":"A j\xF3 magokat neked tartogattam.","You keep this shop in business. Thank you, friend.":"Neked k\xF6sz\xF6nhet\u0151en m\u0171k\xF6dik ez a bolt. K\xF6sz\xF6n\xF6m, bar\xE1tom.","If I could farm like you, I'd close up shop tomorrow.":"Ha \xFAgy gazd\xE1lkodhatn\xE9k, mint te, holnap bez\xE1rn\xE1m a boltot.","Take care of yourself out there.":"Vigy\xE1zz magadra odakint.","Spring seeds sell fastest.":"A tavaszi magok fogynak a leggyorsabban.","Summer is tomato and corn season.":"A ny\xE1r a paradicsom \xE9s a kukorica ideje.","Fall's pumpkins pay the best.":"Az \u0151szi s\xFCt\u0151t\xF6k fizet a legjobban.","Winter's quiet. I do my accounting.":"A t\xE9l csendes. Ilyenkor v\xE9gzem a k\xF6nyvel\xE9st.","Shh! You'll scare the fish.":"Pszt! Elijeszted a halakat.","Face the water with your rod and press Space to cast.":"Fordulj a v\xEDz fel\xE9 a horg\xE1szbottal, \xE9s Sz\xF3k\xF6zzel dobd be.","The lake has bigger fish than your farm pond.":"A t\xF3ban nagyobb halak vannak, mint a farmod tav\xE1ban.","When you see the '!', press Space right away.":"Amint megl\xE1tod a '!'-t, azonnal nyomj Sz\xF3k\xF6zt.","Time the bar \u2014 press Space while the cursor is in the green.":"Id\u0151z\xEDtsd a s\xE1vot \u2014 nyomj Sz\xF3k\xF6zt, amikor a kurzor a z\xF6ldben van.","Trout are tricky, but they sell well.":"A pisztr\xE1ng neh\xE9z, de j\xF3 \xE1ron megy.","You've got the patience of a true angler.":"Igazi horg\xE1sz t\xFCrelmed van.","I caught a catfish this big once. Honest!":"Egyszer egy ekkora harcs\xE1t fogtam. Becssz\xF3!","Fishing with you is the best part of my day.":"A veled val\xF3 horg\xE1szat a napom legjobb r\xE9sze.","Spring bass and pike are biting.":"Tavasszal a s\xFCg\xE9r \xE9s a csuka kap.","Summer catfish hide in the shade.":"Ny\xE1ron a harcs\xE1k az \xE1rny\xE9kban rejt\u0151znek.","Autumn salmon run upstream.":"\u0150sszel a lazacok felfel\xE9 \xFAsznak.","Winter fish are slow, but so am I.":"A t\xE9li halak lass\xFAak, de \xE9n is.","Back in my day we hoed by hand. Uphill. Both ways.":"Az \xE9n id\u0151mben k\xE9zzel kap\xE1ltunk. Felfel\xE9. Mindk\xE9t ir\xE1nyba.","The forest is full of free food if you look.":"Az erd\u0151 tele van ingyen \xE9lelemmel, ha figyelsz.","Hm. A new farmer. We'll see.":"Hm. Egy \xFAj gazda. Megl\xE1tjuk.","Not bad for a beginner, I'll admit.":"Nem rossz egy kezd\u0151t\u0151l, ezt elismerem.","There's a mine in the forest. Bring a pickaxe.":"Az erd\u0151ben van egy b\xE1nya. Vigy\xE9l cs\xE1k\xE1nyt.","Mushrooms in fall, holly in winter. Remember that.":"\u0150sszel gomba, t\xE9len magyal. Jegyezd meg.","You remind me of myself, forty years ago.":"\xD6nmagamra eml\xE9keztetsz negyven \xE9vvel ezel\u0151ttr\u0151l.","This old farm is in good hands with you.":"Ez a r\xE9gi farm j\xF3 kezekben van veled.","Take my advice: never skip watering.":"Fogadd meg a tan\xE1csom: sose hagyd ki az \xF6nt\xF6z\xE9st.","Leeks and daffodils pop up in spring.":"Tavasszal p\xF3r\xE9hagyma \xE9s n\xE1rcisz b\xFAjik el\u0151.","Berries and grapes in summer.":"Ny\xE1ron bogy\xF3k \xE9s sz\u0151l\u0151.","Mushrooms and blackberries in fall.":"\u0150sszel gomba \xE9s szeder.","Holly and snow yams in winter. Dress warm.":"T\xE9len magyal \xE9s h\xF3bat\xE1ta. \xD6lt\xF6zz melegen.","The ocean's big, friend. Big fish out there.":"Nagy az \xF3ce\xE1n, bar\xE1tom. Nagy halak vannak odakint.","Ocean fish bite differently. Be quick!":"Az \xF3ce\xE1ni halak m\xE1sk\xE9pp kapnak. L\xE9gy gyors!","Care for a chat? The tide's patient.":"Besz\xE9lgetn\xE9l egy kicsit? Az ap\xE1ly t\xFCrelmes.","Tuna in summer, octopus in winter.":"Ny\xE1ron tonhal, t\xE9len polip.","Collect shells and coral along the shore.":"Gy\u0171jts kagyl\xF3t \xE9s korallt a part ment\xE9n.","Pufferfish are tricky \u2014 but pay great.":"A g\xF6mbhal neh\xE9z \u2014 de nagyon j\xF3l fizet.","You fish like you were born on the water.":"\xDAgy horg\xE1szol, mintha a v\xEDzen sz\xFClett\xE9l volna.","Stay for sunset. It's the best part.":"Maradj a naplement\xE9ig. Az a legszebb r\xE9sz.","I'd sail anywhere with you.":"B\xE1rhov\xE1 vitorl\xE1zan\xE9k veled.","Spring tides bring sardines.":"A tavaszi dag\xE1ly szard\xEDni\xE1t hoz.","Summer means tuna and pufferfish.":"A ny\xE1r tonhalat \xE9s g\xF6mbhalat jelent.","Autumn tuna are fat and slow.":"Az \u0151szi tonhal k\xF6v\xE9r \xE9s lass\xFA.","Winter octopus hide in the rocks.":"A t\xE9li polipok a szikl\xE1k k\xF6zt b\xFAjnak meg.","Hello, traveler. The sand keeps many secrets.":"\xDCdv, utaz\xF3. A homok sok titkot rejt.","Mind the sun. Water is life out here.":"Vigy\xE1zz a nappal. Itt a v\xEDz maga az \xE9let.","Cactus fruit is sweeter than it looks.":"A kaktuszgy\xFCm\xF6lcs \xE9desebb, mint amilyennek l\xE1tszik.","The oasis holds a fish found nowhere else.":"Az o\xE1zisban \xE9l egy hal, amilyen m\xE1shol nincs.","Sand roses sell for a fortune.":"A homokr\xF3zs\xE1k egy vagyont \xE9rnek.","I walk this desert every day. It never looks the same.":"Minden nap bej\xE1rom ezt a sivatagot. Sosem n\xE9z ki ugyan\xFAgy.","You're the first stranger I've trusted in years.":"Te vagy az els\u0151 idegen, akiben \xE9vek \xF3ta megb\xEDzom.","Come, I'll show you the best dunes.":"Gyere, megmutatom a legszebb d\u0171n\xE9ket.","The desert is kinder with good company.":"A sivatag kedvesebb j\xF3 t\xE1rsas\xE1ggal.","Spring brings a rare cool breeze.":"A tavasz ritka, h\u0171s szell\u0151t hoz.","Summer here is no joke. Stay hydrated.":"Itt a ny\xE1r nem tr\xE9fa. Igy\xE1l sokat.","Autumn nights are bright with stars.":"Az \u0151szi \xE9jszak\xE1k f\xE9nyesek a csillagokt\xF3l.","Even desert winters bite at night.":"M\xE9g a sivatagi t\xE9l is cs\xEDp \xE9jjel.","Oh! I didn't hear you over the birdsong.":"\xD3! Nem hallottalak a mad\xE1rcsicserg\xE9st\u0151l.","Plants talk if you listen long enough.":"A n\xF6v\xE9nyek besz\xE9lnek, ha el\xE9g sok\xE1ig hallgatod \u0151ket.","The forest soil is rich. Better than your farm, probably.":"Az erd\u0151 talaja gazdag. Val\xF3sz\xEDn\u0171leg jobb, mint a farmod\xE9.","Ever tried kale in winter? Underrated.":"Pr\xF3b\xE1lt\xE1l m\xE1r t\xE9len kelk\xE1poszt\xE1t? Alul\xE9rt\xE9kelt.","A greenhouse lets you grow anything, any time.":"Egy \xFCvegh\xE1zban b\xE1rmit termeszthetsz, b\xE1rmikor.","I keep a notebook of every flower in the valley.":"F\xFCzetet vezetek a v\xF6lgy minden vir\xE1g\xE1r\xF3l.","You've got a gardener's heart.":"Kert\xE9sz sz\xEDved van.","Let me show you my secret mushroom patch some day.":"Majd egyszer megmutatom a titkos gombafoltomat.","Everything blooms nicer when you're around.":"Minden szebben vir\xE1gzik, ha a k\xF6zelben vagy.","Spring is the busiest season for botanists.":"A tavasz a legny\xFCzsg\u0151bb \xE9vszak egy botanikusnak.","Summer sun makes everything grow wild.":"A ny\xE1ri nap mindent vadul n\xF6veszt.","Autumn colors are my favorite palette.":"Az \u0151szi sz\xEDnek a kedvenc palett\xE1m.","Winter sleep is just plants gathering strength.":"A t\xE9li \xE1lom csak a n\xF6v\xE9nyek er\u0151gy\u0171jt\xE9se.","Shh, I'm in the middle of a sentence.":"Pszt, egy mondat k\xF6zep\xE9n vagyok.","I write about this valley. Don't worry, you're only a footnote.":"Err\u0151l a v\xF6lgyr\u0151l \xEDrok. Ne agg\xF3dj, te csak egy l\xE1bjegyzet vagy.","Writer's block is the real monster.":"Az \xEDr\xF3i v\xE1ls\xE1g az igazi sz\xF6rnyeteg.","You might make it into chapter two.":"Lehet, hogy beker\xFClsz a m\xE1sodik fejezetbe.","I hear there's an island past the beach. Material!":"\xDAgy hallom, a parton t\xFAl van egy sziget. Alapanyag!","Treasure hunters make the best characters.":"A kincsvad\xE1szok a legjobb szerepl\u0151k.","I've written you a whole chapter. It's too flattering to show you.":"Egy eg\xE9sz fejezetet \xEDrtam r\xF3lad. T\xFAl h\xEDzelg\u0151 ahhoz, hogy megmutassam.","Every story needs someone like you.":"Minden t\xF6rt\xE9netnek kell valaki, mint te.","Come back tomorrow. I'll read you the ending.":"Gyere vissza holnap. Felolvasom a v\xE9g\xE9t.","Spring is for new beginnings. Clich\xE9, but true.":"A tavasz az \xFAj kezdetek ideje. K\xF6zhely, de igaz.","Summer afternoons are for notebooks and lemonade.":"A ny\xE1ri d\xE9lut\xE1nok a jegyzetf\xFCzet\xE9 \xE9s a limon\xE1d\xE9\xE9.","Autumn is when the words flow best.":"\u0150sszel folynak legjobban a szavak.","Winter nights are for finishing manuscripts.":"A t\xE9li \xE9jszak\xE1k a k\xE9ziratok befejez\xE9s\xE9\xE9."},tr=e=>e[0].toLowerCase()+e.slice(1),or={};for(let[e,t]of Object.entries(ar) : I never told anyone why I came to this valley.","Rosa: I was a city baker. Every day the same queue, and nobody ever said thank you.",{emote:["rosa","\u2026"]},"Rosa: Then you ate my first burnt loaf and asked for a second.","Rosa: This valley became home because of people like you. Thank you.","The loaf is still warm."],reward:{pts:60,money:600}}},oliver:{4:{lines:["Oliver is rearranging the same shelf for the third time.","Oliver: Business is slow and I'm talking to jars of seeds. Thanks for stopping by.","Oliver: A good customer deserves a bonus. Here's a little something on the house."],reward:{pts:30,money:150}},8:{lines:["Oliver closes the shop early and hangs a sign on the door.","Oliver: I used to dream of a farm of my own. Now I sell seeds to people who do the dreaming for me.","Oliver: You're doing it right. Here, a share of my best stock."],reward:{pts:50,item:"tonic"}}},mina:{4:{lines:["Mina is sitting on the dock with a tangled fishing line.","Mina: Three hours, no bites, and now this. The lake is laughing at me.","Mina: You help me untangle it, and I'll give you my lucky bait."],reward:{pts:30,item:"bass"}},8:{lines:["Mina points at the water. Something huge and silver moves under the surface.","Mina: Every year it shows up and I never catch it. Today I just wanted someone to see it with me.","Mina: Thanks for being here. Take this \u2014 for your next big fish."],reward:{pts:50,money:300}},6:{lines:["Mina sits on the dock, rod trembling, eyes locked on the water.","Mina: Shh! Don't move. It's here. The silver one.",{emote:["mina","!"]},{walk:["mina",1,-1]},"A huge splash, and Mina is soaked from head to toe.","Mina: It got away... again.",{emote:["mina","\u266A"]},"Mina: But I'm laughing, so I guess it was a good day."],reward:{pts:40,item:"bass"}},10:{lines:["Mina hands you a worn fishing rod wrapped in cloth.","Mina: This was my grandfather's first rod. I caught my first fish with it, and my first disappointment.","Mina: I want you to have it. Not to use. To remember that patience is a kind of friendship.",{emote:["mina","\u2665"]},"Mina: Cast something far for me, okay?"],reward:{pts:60,money:500}}},ben:{4:{lines:["Ben is leaning on his old fence, looking at an empty field.","Ben: Forty years I farmed this. Now my knees say no and the field says yes.","Ben: Keep the soil good. Take this \u2014 it was always lucky for me."],reward:{pts:30,item:"gold"}},8:{lines:["Ben carries a faded photo out onto the porch.","Ben: That's me and my late spouse the first spring here. The farm started as a promise.","Ben: You remind me of us. Please take care of this valley."],reward:{pts:50,money:400}},6:{lines:["Ben is repainting a worn-out scarecrow in front of his house.","Ben: Forty summers it's guarded my field. Never lost a single crow fight.","Ben: Iris says it's creepy. I say it's loyal.",{emote:["ben","!"]},"Ben: Hold the ladder, farmer.",{walk:["ben",0,-1]},"You hold the ladder while Ben fixes the scarecrow's hat.","Ben: There. Good as new. Almost as handsome as me."],reward:{pts:40,money:250}},10:{lines:["Ben presses an old key into your hand as the sun sets over his empty field.","Ben: This opens the old shed behind my house. It's yours now.","Ben: I won't be farming much longer, but this valley needs hands like yours.",{emote:["ben","\u2026"]},"Ben: Promise me the scarecrow stays.","You: I promise.","Ben: Good. Then I can rest easy."],reward:{pts:60,item:"iron",money:800}}},marlo:{4:{lines:["Marlo is gutting fish on the sand and humming off key.","Marlo: Sorry \u2014 nobody's listened to my singing in years. Not even the gulls.","Marlo: Take some of today's catch, friend. Singing is hungry work."],reward:{pts:30,item:"sardine"}},8:{lines:["Marlo stands at the shore as the sun goes down.","Marlo: The sea gave me everything, and took a boat or two. I'd do it all again.","Marlo: Here's a pearl I found years ago. It belongs with someone who looks at the horizon."],reward:{pts:50,item:"pearl"}}},dune:{4:{lines:["Dune draws a map in the sand with a stick.","Dune: The desert has no roads, only memory. I will teach you the way to the oasis.","Dune: Carry this. It is a small thing, but it remembers the way home."],reward:{pts:30,item:"sandrose"}},8:{lines:["Dune lights a fire and the sky fills with stars.","Dune: Where I come from, a guest who shares a fire is family.","Dune: Take this stone. If you ever feel lost, hold it and think of the stars."],reward:{pts:50,item:"amethyst"}}},iris:{4:{lines:["Iris kneels over a tiny seedling, shielding it from the wind.","Iris: This one has never grown here before. I think it likes you being nearby.","Iris: Please accept a few of my kale seeds for your farm."],reward:{pts:30,money:120}},8:{lines:["Iris shows you a hidden clearing full of glowing flowers.","Iris: I've never shown anyone this. It only blooms when someone kind walks through.","Iris: Take a flower for your table. The valley is lucky to have you."],reward:{pts:50,item:"daffodil"}},6:{lines:["Iris kneels beside a seedling that glows faintly in the shade.","Iris: Look. It only opens when it hears someone laugh.","Iris: Go on, farmer. Tell it a joke.","You: Why did the turnip blush? It saw the salad dressing!",{emote:["iris","\u2026"]},"Iris: ...That was terrible.","The bloom opens anyway.",{emote:["iris","\u2665"]},"Iris: It likes you."],reward:{pts:40,item:"daffodil"}},10:{lines:["Iris leads you into a clearing where hundreds of flowers glow in the dark.","Iris: Grandpa Ben planted the first ones. I only learned to keep them alive.","Iris: Every spring I plant one more. This year, I'd like to plant one with you.","You kneel together and plant a single glowing seed.",{emote:["iris","\u2665"]},"Iris: Now the valley has a little bit of both of us."],reward:{pts:60,money:500}}},quill:{4:{lines:["Quill has crumpled pages scattered around the bench.","Quill: The hero walks into the tavern and then \u2014 nothing. I'm stuck on the same page.","Quill: Talking helped. Take this, a stolen coin from chapter two."],reward:{pts:30,item:"coin"}},8:{lines:["Quill reads aloud from a new page, voice trembling.","Quill: 'The farmer woke before dawn and the valley woke with them.' Do you like it?","Quill: I wrote you into the book. Take this \u2014 you've earned your own chapter."],reward:{pts:50,money:350}},6:{lines:["Quill paces in circles, muttering into a notebook.","Quill: Chapter two. The farmer walks into the forest. And then... nothing!",{emote:["quill","?"]},"Quill: What would you do, truly?","You: Pick up a strange glowing flower.","Quill: A glowing flower! Yes! But what is it for?","You: It opens when you tell it a joke.","Quill: ...I'm writing that down."],reward:{pts:40,item:"coin"}},10:{lines:["Quill hands you a thick bound book. The cover reads: Tiny Valley.","Quill: It's finished. Every chapter, every festival, every burnt loaf.","Quill: You're on every page. I hope that's all right.","You: It's perfect.",{emote:["quill","\u2665"]},"Quill: Then thank you for being the story."],reward:{pts:60,money:700}}},nora:{4:{lines:["Nora is sorting bandages and humming a lullaby.","Nora: Oh! A long shift. Everyone seems to trip over their own boots today.","Nora: Here, a free tonic from the clinic. Don't tell the others."],reward:{pts:30,item:"tonic"}},8:{lines:["Nora sits on the clinic steps at dusk, staring at the sky.","Nora: I became a nurse because my family needed one. I never asked if I wanted it. But I do.","Nora: Thank you for listening. Take this, you deserve it."],reward:{pts:50,money:300}}},hugo:{4:{lines:["Hugo hammers a glowing blade and stops when he sees you.","Hugo: Eh, don't stand so close. Sparks.","Hugo: Take this. It's a scrap of gold from a failed project."],reward:{pts:30,item:"gold"}},8:{lines:["Hugo shows you a dusty anvil in the back room.","Hugo: My father's. I haven't lit this fire in years. It felt wrong to do it alone.","Hugo: You made it feel right. Take this, and thank you."],reward:{pts:50,money:400}}},lena:{4:{lines:["Lena is balancing a tower of books and a cup of tea.","Lena: Oh, don't mind the mess. I'm reorganising by mood now.","Lena: A bookmark for you. It's hand-painted. Please treat it kindly."],reward:{pts:30,item:"coin"}},8:{lines:["Lena closes the library early and lights a small lantern.","Lena: There's a poem in the margins of the oldest book here. I think it was left for whoever needed it.","Lena: It's yours now. Take this, as a thank-you."],reward:{pts:50,item:"amethyst"}}},theo:{4:{lines:["Theo is dusting a clay pot with a tiny brush.","Theo: This is eight hundred years old. And I broke it. Twice.","Theo: Take this coin, it's from the same dig. It's lucky."],reward:{pts:30,item:"coin"}},8:{lines:["Theo unrolls an old map across the museum floor.","Theo: The island holds more than a few buried coins. Someone once lived there, you know.","Theo: Take this. And promise to bring me every strange thing you find."],reward:{pts:50,item:"pearl"}}},hazel:{4:{lines:["Hazel is staring at a crooked shelf with her arms crossed.","Hazel: I built that at midnight. In my defence, it was dark.","Hazel: Take some planks. I've got too many and no more shelves."],reward:{pts:30,item:"wood"}},8:{lines:["Hazel unrolls a blueprint on the counter, with a tiny drawing of a cabin.","Hazel: I always wanted to build a house for someone I care about. I'm still drawing it.","Hazel: Take this for your next project. You inspire me."],reward:{pts:50,money:500}}}},rn={rosa:[["oliver","brother"]],oliver:[["rosa","sister"]],ben:[["iris","granddaughter"]],iris:[["ben","grandfather"]],marlo:[["mina","daughter"]],mina:[["marlo","father"]],nora:[["hugo","brother"]],hugo:[["nora","sister"]],theo:[["lena","niece"]],lena:[["theo","uncle"]]},ln={rosa:"Oliver pretends he doesn't like my pastries, yet he eats half the tray.",oliver:"Rosa bakes, I count the coins. It's a family business, really.",ben:"Iris is always in the woods. She gets that from her grandmother.",iris:"Grandpa Ben tells the same farm stories every
